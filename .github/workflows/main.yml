name: CI/CD

on: push: branches: - Dev

env: IMAGE_NAME: mio

jobs: build-deploy: runs-on: ubuntu-latest

steps: - name: Checkout Source uses: actions/checkout@v4

- name: Set up Node.js uses: actions/setup-node@v4 with: node-version: '22' cache: npm

- name: Install Dependencies run: npm ci

- name: Build Angular Project run: npm run build

- name: Login to Docker Hub uses: docker/login-action@v3 with: username: ${{ secrets.DOCKERUSERNAME }} password: ${{ secrets.DOCKERPASSWORD }}

- name: Build Docker Image run: | docker build -t 

{{ env.IMAGE_NAME }}:latest .

- name: Push Image run: | docker push 

{{ env.IMAGE_NAME }}:latest

- name: Deploy to EC2 uses: appleboy/ssh-action@v1.2.0 with: host: ${{ secrets.EC2HOST }} username: ${{ secrets.EC2USER }} key: ${{ secrets.EC2SSHKEY }} script: | docker pull 

{{ env.IMAGE_NAME }}:latest

docker stop mio || true docker rm mio || true

docker run -d
--name mio
--restart unless-stopped
-p 8888:80


{{ env.IMAGE_NAME }}:latest

docker image prune -f