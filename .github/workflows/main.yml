name: ifieldsmart-mio

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ifieldsmart-mio

jobs:
  build-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build --if-present

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ifieldsmart-mio:latest .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ifieldsmart-mio:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            docker pull ${{ secrets.DOCKER_USERNAME }}/ifieldsmart-mio:latest

            docker stop spring-boot-app || true

            docker rm spring-boot-app || true

            docker run -d \
              --name spring-boot-app \
              --restart unless-stopped \
              -p 9999:80 \
              ${{ secrets.DOCKER_USERNAME }}/ifieldsmart-mio:latest

            docker image prune -
